<style>
  /* A dark notice board in a candle-lit room. Everything on it is a taped paper card: the invitation, the evening's
     running order, and the jobs anyone may take for an hour (cook, pour, perform). Taking a card = taking part. */
  @font-face { font-family:"BravoRG"; src:url("/assets/fonts/BravoRG.woff2") format("woff2"), url("/assets/fonts/BravoRG.woff") format("woff"); font-display:swap; }
  :root {
    --board:#131211; --line:rgba(237,232,223,.1); --chalk:#ede8df; --dim:rgba(237,232,223,.56); --glow:236,113,54;

  }
  * { box-sizing:border-box; }
  html { background:var(--board); }
  body { margin:0; color:var(--chalk); font-family:var(--sans); font-size:16px; line-height:1.5; min-height:100vh; overflow-x:hidden;
    background-image:radial-gradient(rgba(237,232,223,.075) 1px, transparent 1.3px); background-size:22px 22px; }

    background:
      radial-gradient(36% 28% at 12% 2%, rgba(var(--glow),.2), transparent 70%),

    box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 18px 30px -16px rgba(0,0,0,.85), 0 2px 4px rgba(0,0,0,.45);

  .card:last-child { margin-bottom:0; }
  .blue { background-color:var(--blue); } .sage { background-color:var(--sage); } .peach { background-color:var(--peach); }
  .yellow { background-color:var(--yellow); } .rose { background-color:var(--rose); }
  .tape::before { content:""; position:absolute; top:-10px; left:50%; width:78px; height:21px; margin-left:-39px; background:rgba(236,224,180,.6);
    box-shadow:0 1px 2px rgba(0,0,0,.28); transform:rotate(var(--tr, -3deg)); border-left:1px dashed rgba(0,0,0,.06); border-right:1px dashed rgba(0,0,0,.06); }
  .card p { margin:0 0 12px; text-wrap:pretty; }
  .card p:last-child { margin-bottom:0; }
  .meta { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--ink-2); margin:0 0 12px; }
  .chip { display:inline-block; padding:3px 7px 2px; border-radius:4px; background:rgba(27,26,23,.1); color:var(--ink); white-space:nowrap; }
  .chip.hot { background:var(--accent); color:#fff; }
  @media (hover:hover) { .lift:hover { transform:rotate(0deg) translateY(-3px); } }

  @keyframes deal { from { opacity:0; transform:translate(-22px, 46px) rotate(-9deg); } }
  @media (prefers-reduced-motion:reduce) { body::before, .deal .card, .stamp { animation:none !important; } .card { transition:none; } }

  /* invitation */
  .invite { --r:-.9deg; padding:22px 20px 22px; }

  .invite .lead { font-size:18px; font-weight:500; }

  .invite .when { font-weight:600; border-top:1px solid var(--rule); padding-top:12px; margin-top:16px; }

  .linkbtn:hover, .linkbtn:focus-visible { border-color:var(--accent); outline:0; }
  .copy { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .copy code { font:12px var(--mono); background:rgba(255,255,255,.45); padding:6px 8px; border-radius:4px; word-break:break-all; }

  /* running order */
  .pgrid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 12px; }
  .pgrid .card { margin:0; padding:14px 13px 13px; }
  .pgrid .card:last-child:nth-child(odd) { grid-column:1 / -1; }
  .pgrid .card:nth-child(4n+1) { --r:-1.3deg; } .pgrid .card:nth-child(4n+2) { --r:1deg; } .pgrid .card:nth-child(4n+3) { --r:.8deg; } .pgrid .card:nth-child(4n) { --r:-1deg; }
  .pgrid .tape::before { width:54px; margin-left:-27px; height:18px; top:-9px; }
  .pgrid time { font:600 21px var(--mono); letter-spacing:-.01em; }
  .pgrid b { display:block; font-weight:600; font-size:15.5px; line-height:1.25; margin:8px 0 4px; }
  .pgrid small { display:block; font-size:13.5px; line-height:1.38; color:var(--ink-2); }

  /* reply */
  form { margin:0; }
  fieldset { border:0; margin:0; padding:0; min-width:0; }
  .ask { --r:.5deg; }
  .ask h3, .last h3 { font-family:var(--bravo); font-weight:400; text-transform:uppercase; font-size:24px; letter-spacing:.03em; margin:0 0 12px; line-height:1; }
  .three { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .three label { position:relative; display:block; text-align:center; border:1.5px solid var(--ink); border-radius:6px; padding:14px 4px 11px; font-family:var(--bravo); text-transform:uppercase; font-size:18px; letter-spacing:.03em; cursor:pointer; user-select:none; transition:transform .2s; }

  .three label:has(input:focus-visible), .opt:has(input:focus-visible), .slots label:has(input:focus-visible), .task:has(.pickrow input:focus-visible) { outline:2px solid var(--accent); outline-offset:2px; }
  .field { display:block; margin:16px 0 0; }

  input[type=text]::placeholder, textarea::placeholder { font-family:var(--sans); font-weight:400; font-size:15px; color:rgba(27,26,23,.5); }
  input[type=text]:focus, textarea:focus { outline:0; border-bottom:1.5px solid var(--accent); }
  textarea { resize:vertical; min-height:36px; display:block; }

  .task { padding:0; filter:saturate(.72) brightness(.9); }
  .task.mine { filter:none; --r:var(--mr, -1.2deg); }
  .task.mine::before { content:""; position:absolute; top:-10px; left:26px; width:70px; height:21px; background:rgba(236,224,180,.6); box-shadow:0 1px 2px rgba(0,0,0,.28); transform:rotate(-5deg); }
  .task:nth-of-type(even) { --mr:1deg; }
  .pickrow { display:block; padding:16px 16px 15px; cursor:pointer; }
  .pickrow b { display:block; font-weight:600; font-size:17px; line-height:1.25; }
  .pickrow small, .hint { display:block; color:var(--ink-2); font-size:14px; line-height:1.4; margin-top:4px; }
  .state .on, .task.mine .state .off { display:none; }
  .task.mine .state { background:var(--ink); color:var(--cream); }
  .task.mine .state .on { display:inline; }
  .more { padding:0 16px 16px; }
  .slots { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:8px; }
  .slots label { position:relative; border:1.5px solid var(--ink); border-radius:6px; padding:9px 6px 7px; text-align:center; cursor:pointer; font:600 16px var(--mono); }
  .slots label:has(input:checked) { background:var(--ink); color:var(--cream); }
  .slots label.full { opacity:.36; cursor:not-allowed; text-decoration:line-through; }
  .slots i { display:block; font-style:normal; font-size:11px; font-weight:400; letter-spacing:.04em; margin-top:3px; }
  .santa { background-color:var(--red); color:#fff3e4; }
  .santa .meta, .santa small, .santa .hint { color:rgba(255,243,228,.8); }

  .santa input[type=text]::placeholder { color:rgba(255,243,228,.7); }
  .santa h3 { font-family:var(--bravo); font-weight:400; text-transform:uppercase; font-size:24px; margin:0 0 12px; line-height:1; }
  .santa .name { font-family:var(--hand); font-weight:400; font-size:46px; line-height:1; display:block; margin:6px 0 10px; transform:rotate(-2deg); }
  .santa .btn { background:#fff3e4; color:var(--red); }
  .last { --r:-.4deg; }
  .last .field:first-child { margin-top:0; }
  .opt { position:relative; display:grid; grid-template-columns:26px 1fr; gap:10px; padding:14px 0 4px; cursor:pointer; font-size:15px; }
  .opt .box { width:22px; height:22px; border:1.5px solid var(--ink); border-radius:4px; display:grid; place-items:center; font-family:var(--hand); font-weight:400; font-size:32px; line-height:0; color:transparent; }
  .opt:has(input:checked) .box { color:var(--accent); }
  .btn { display:inline-block; font-family:var(--bravo); text-transform:uppercase; letter-spacing:.04em; font-size:19px; background:var(--accent); color:#fff; border:0; padding:15px 24px 12px; cursor:pointer; border-radius:6px; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .btn.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn.small { font-size:14px; padding:8px 12px 6px; }
  .msg { margin:12px 0 0 !important; font-weight:600; }

  .done { --r:-.8deg; padding-right:128px; min-height:150px; }

  .stamp { position:absolute; top:16px; right:14px; width:104px; height:104px; border-radius:50%; border:3px double var(--stamp); color:var(--stamp); display:grid; place-content:center; text-align:center; gap:2px;
    transform:rotate(-13deg); opacity:.86; mix-blend-mode:multiply; animation:stamp .5s .45s cubic-bezier(.2,1.4,.4,1) backwards; }
  .stamp b { font-family:var(--bravo); font-weight:400; text-transform:uppercase; font-size:21px; line-height:1; }

  .tags { display:flex; flex-wrap:wrap; gap:8px 8px; margin:0 4px 16px; }

  .tags span:nth-child(5n+1) { background:var(--peach); } .tags span:nth-child(5n+2) { background:var(--blue); } .tags span:nth-child(5n+3) { background:var(--yellow); }
  .tags span:nth-child(5n+4) { background:var(--sage); } .tags span:nth-child(5n) { background:var(--rose); }
  .tags span:nth-child(3n) { transform:rotate(-2deg); } .tags span:nth-child(4n+1) { transform:rotate(1.6deg); }
  .tally { --r:.7deg; --tr:4deg; width:min(100%, 380px); padding:18px 18px 10px; margin-top:22px; }
  .tally ul { list-style:none; margin:0; padding:0; }
  .tally li { display:flex; align-items:baseline; gap:10px; padding:5px 0 6px; border-bottom:1.5px dotted var(--rule); font-size:15px; line-height:1.3; }
  .tally li:last-child { border-bottom:0; }
  .tally b { flex:none; min-width:46px; font-family:var(--hand); font-weight:400; font-size:30px; line-height:.9; color:var(--accent); }

  /* door + picker */
  .names { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:0 0 4px; }
  .names button { font:600 15px var(--sans); text-align:left; color:var(--ink); background:var(--cream) var(--noise); border:0; border-radius:4px; padding:11px 12px 10px; cursor:pointer; box-shadow:0 8px 14px -8px rgba(0,0,0,.8); transition:transform .2s; }
  .names button:nth-child(3n+1) { transform:rotate(-.8deg); } .names button:nth-child(3n) { transform:rotate(.9deg); }
  .names button:nth-child(4n+2) { background-color:var(--sage); } .names button:nth-child(4n+3) { background-color:var(--peach); } .names button:nth-child(4n) { background-color:var(--blue); }

  .sure .hand { font-size:34px; line-height:1.05; display:block; margin:0 0 14px; }

  footer { margin-top:26px; color:var(--dim); text-align:center; }
  [hidden] { display:none !important; }

  @media (min-width:1000px) {
    .wrap { max-width:1120px; padding:22px 24px 72px; }
    .cols { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:16px; align-items:start; }
    .zone { padding:14px 18px 26px; }
    .narrow { max-width:600px; margin-left:auto; margin-right:auto; }

  }
</style>
</head>

    });
    var plusBox = me.plusAllowed ? el('label', { class: 'field' }, [el('span', { text: t('plus') }), el('input', { type: 'text', name: 'plus', maxlength: '60', placeholder: t('plusPh'), value: me.plus })]) : null;
    form.appendChild(card('tape ask', [el('h3', { text: t('q') }), three, plusBox]));

    var grid = el('div', { class: 'slots' });
    (S.data.slots || []).forEach(function (s) {
      var mine = me.shift === s && me.parts.indexOf('bar') >= 0;
      var others = Math.max(0, (party.bar[s] || 0) - (mine ? 1 : 0));
      var tag = others ? others + ' ' + t('applied') : t('free');
      grid.appendChild(el('label', { title: tag }, [el('input', { type: 'radio', name: 'shift', value: s, checked: mine }), s, el('i', { text: tag })]));
    });
    var tasks = [
      task('cook', t('kCook'), 'sage', t('cook'), t('cookHint'), me.parts.indexOf('cook') >= 0, null, sync),
      task('bar', t('kBar'), 'peach', t('bar'), t('barHint'), me.parts.indexOf('bar') >= 0, el('div', { class: 'more' }, [el('span', { class: 'hint', text: t('pick') }), grid]), sync),
      task('act', t('kAct'), 'blue', t('act'), t('actHint'), me.parts.indexOf('act') >= 0, el('div', { class: 'more' }, [el('textarea', { name: 'actText', rows: '1', maxlength: '300', placeholder: t('actPh'), text: me.act })]), sync)
    ];
    var santaTask = null;
    if (S.data.santa && S.data.santa.state === 'open') {
      santaTask = task('santa', t('santaH'), 'santa', t('santa'), t('santaHint'), me.santa,
        el('div', { class: 'more' }, [el('input', { type: 'text', name: 'wish', maxlength: '200', placeholder: t('wishPh'), value: me.wish })]), sync);
      tasks.push(santaTask);
    }
    var closed = S.data.applyOpen === false;
    if (closed) tasks.slice(0, 3).forEach(function (c) {
      c.hidden = !c._in.checked;
      Array.prototype.forEach.call(c.querySelectorAll('input, textarea'), function (f) { f.disabled = true; });
    });
    var rest = el('div', {}, [el('p', { class: 'onboard', style: 'margin-top:22px' }, [el('b', { text: t('partsH') }), el('small', { text: closed ? t('partsClosed') : t('partsSub') })])].concat(tasks));
    form.appendChild(rest);

    var send = el('button', { type: 'submit', class: 'btn', style: 'margin-top:14px', text: t('send') });
    var msg = el('p', { class: 'msg err', hidden: true });
    form.appendChild(card('last', [
      el('label', { class: 'field' }, [el('span', { text: t('note') }), el('textarea', { name: 'note', rows: '1', maxlength: '300', placeholder: t('notePh'), text: me.note })]),
      option('show', t('show'), me.show), send, msg
    ], { style: 'margin-top:16px' }));

    function val(n) { var f = form.elements[n]; return f ? f.value : ''; }
    function on(n) { var f = form.elements[n]; return !!(f && f.checked); }
    function sync() {
      var r = val('rsvp');
      rest.hidden = !r || r === 'no';
      if (plusBox) plusBox.hidden = !r || r === 'no';
      tasks.forEach(function (c) { c.classList.toggle('mine', c._in.checked); if (c._more) c._more.hidden = !c._in.checked; });
      if (santaTask) santaTask.hidden = r !== 'yes';
    }
    sync();

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.hidden = true;
      var r = val('rsvp');
      if (!r) { msg.textContent = t('eRsvp'); msg.hidden = false; return; }
      var p = ['cook', 'bar', 'act'].filter(on);
      if (!closed && r !== 'no' && on('bar') && !val('shift')) { msg.textContent = t('eShift'); msg.hidden = false; return; }
      send.disabled = true; send.textContent = t('sending');
      api('POST', { k: S.k, rsvp: r, parts: p, shift: val('shift'), act: val('actText'), plus: val('plus'), santa: on('santa'), wish: val('wish'), note: val('note'), show: on('show') })
        .then(function (j) {
          if (j.me) { S.data = j; S.editing = false; render(); var d = document.getElementById('done'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
          send.disabled = false; send.textContent = t('send'); msg.textContent = errText(j.error); msg.hidden = false;
          if (j.error === 'slot_full') load(true);
        });
    });
    return zone(t('rsvpH'), S.data && S.data.me && S.data.me.group === 'team' ? t('untilTeam') : t('until'), [form]);
  }

  function done(me) {
    var recap = el('div', { class: 'recap' });
    var chip = function (s) { recap.appendChild(el('span', { class: 'chip mono', text: s })); };
    var dec = me.decision, decided = null;
    if (me.rsvp !== 'no') {
      if (me.plus) chip(t('rPlus') + ' ' + me.plus);
      if (!dec) {
        if (me.parts.indexOf('cook') >= 0) chip('✓ ' + t('kCook'));
        if (me.parts.indexOf('bar') >= 0) chip('✓ ' + t('kBar') + ' ' + (me.shift || ''));
        if (me.parts.indexOf('act') >= 0) chip('✓ ' + t('kAct'));
      }
      if (me.santa) chip('✓ ' + t('santaH'));
    }
    if (dec) {
      var got = el('div', { class: 'recap' });
      if (dec.cook) got.appendChild(el('span', { class: 'chip mono', text: '✓ ' + t('kCook') }));
      if (dec.bar) got.appendChild(el('span', { class: 'chip mono', text: '✓ ' + t('kBar') + ' ' + dec.bar }));
      if (dec.act) got.appendChild(el('span', { class: 'chip mono', text: '✓ ' + t('kAct') }));
      var missed = ['cook', 'bar', 'act'].filter(function (k) { return me.parts.indexOf(k) >= 0 && !dec[k]; }).map(function (k) { return t('decWhere')[k]; });
      var said = missed.length > 1 ? missed.slice(0, -1).join(', ') + t('decAnd') + missed[missed.length - 1] : missed[0];
      if (got.childNodes.length || missed.length) decided = el('div', {}, [
        el('h3', { text: t('decH') }),
        got.childNodes.length ? got : null,
        got.childNodes.length ? el('p', { class: 'hint', text: t('decOk') }) : null,
        missed.length ? el('p', { class: 'hint', text: t('decNo')(said) }) : null
      ]);
    }
    return zone(t('rsvpH'), t('until'), [card('tape done', [
      el('div', { class: 'stamp', 'aria-hidden': 'true' }, [el('b', { text: me.rsvp === 'yes' ? t('yes') : me.rsvp === 'maybe' ? t('maybe') : t('no') }), el('span', { class: 'mono', text: 'KKC · 22.12' })]),
      el('span', { class: 'hand', text: me.rsvp === 'yes' ? t('doneYes') : me.rsvp === 'maybe' ? t('doneMaybe') : t('doneNo') }),
      el('p', { text: t('doneSub') }),
      recap.childNodes.length ? recap : null,
      recap.childNodes.length && me.parts.length && !dec ? el('p', { class: 'hint', text: S.data.applyOpen === false ? t('partsClosed') : t('doneParts') }) : null,
      decided,
      el('button', { type: 'button', class: 'btn ghost small', text: t('edit'), on: { click: function () { S.editing = true; render(); } } })
    ], { id: 'done' })]);
  }

  function santaCard(s) {
    if (!s || s.state === 'open') return null;
    var c = card('santa tape', [el('h3', { text: t('sDrawnH') })], { style: '--r:1deg' });
    if (s.state === 'missed') c.appendChild(el('p', { text: t('sMissed') }));
    else {
      var inside = el('div', { hidden: true }, [
        el('p', { style: 'margin:0', text: t('sYou') }), el('span', { class: 'name', text: s.to.name }),
        el('p', { text: s.to.wish ? t('sWish') + ' ' + s.to.wish : t('sNoWish') }), el('p', { class: 'hint', text: t('sRule') })
      ]);
      var open = el('button', { type: 'button', class: 'btn', text: t('sOpen'), on: { click: function () { open.hidden = true; inside.hidden = false; } } });
      c.appendChild(open); c.appendChild(inside);
    }
    return zone(t('santaH'), t('kSanta'), [c]);
  }

  function who(party, s) {
    var kids = [];
    if (party.who.length) {
      var tags = el('div', { class: 'tags' });
      party.who.forEach(function (p) { tags.appendChild(el('span', { text: p.n })); });
      kids.push(tags);
    } else kids.push(el('p', { class: 'onboard', text: t('whoEmpty') }));
    var taken = 0; for (var k in party.bar) taken += party.bar[k] || 0;
    var one = function (n) { return lang === 'lv' ? n % 10 === 1 && n % 100 !== 11 : n === 1; };
    var list = el('ul');
    [[party.maybe, t('nMaybe')], [taken, t('nBar')], [party.acts, t('nAct')[one(party.acts) ? 0 : 1]], [party.cooks, t('nCook')[one(party.cooks) ? 0 : 1]]].forEach(function (n) {
      list.appendChild(el('li', {}, [el('b', { text: String(n[0]) }), el('span', { text: n[1] })]));
    });
    kids.push(card('tape tally', [list]));
    if (s && s.state === 'open') kids.push(el('p', { class: 'fine', text: t('sWait')(s.count) }));
    return zone(t('whoH'), party.yes + ' ' + t('nYes'), kids);
  }

  function render() {
    chrome();
    app.textContent = ''; app.className = '';
    if (S.view === 'door') return app.appendChild(door(S.err));
    if (S.view === 'picker') return app.appendChild(picker());
    if (S.view !== 'main') return app.appendChild(el('section', { class: 'zone narrow' }, [card('tape', [el('p', { text: t('loading') })])]));
    var d = S.data, me = d.me;
    var a = el('div'), b = el('div');
    [invite(me), santaCard(d.santa), programme(me)].forEach(function (n) { if (n) a.appendChild(n); });
    [(me.answered && !S.editing) ? done(me) : coupon(me, d.party), who(d.party, d.santa)].forEach(function (n) { if (n) b.appendChild(n); });
    app.className = 'cols' + (S.dealt ? '' : ' deal');
    if (me.group === 'team' && !S.fresh) b.appendChild(el('p', { class: 'fine mylink' }, [el('span', { text: t('keepShort') })].concat(linkButtons('linkbtn mono'))));
    app.appendChild(a); app.appendChild(b);
    if (!S.dealt) {
      S.dealt = true;
      [].forEach.call(app.querySelectorAll('.card'), function (c, i) { c.style.setProperty('--i', Math.min(i, 12)); });
      setTimeout(function () { app.classList.remove('deal'); }, 1700);
    }
  }

  function load(keepEditing) {
    api('GET', { k: S.k }).then(function (j) {
      if (j.me) { S.data = j; S.view = 'main'; store.set('zsv_k', S.k); if (!keepEditing) S.editing = false; }
      else if (S.team && !qs.get('k')) { S.k = ''; return start(); }
      else { S.view = 'door'; S.err = errText(j.error); }
      render();
    });
  }
  function start() {
    if (S.k) return load();
    if (S.team) return api('GET', { t: S.team }).then(function (j) {
      if (j.team) { S.teamList = j.team; S.view = 'picker'; } else { S.view = 'door'; S.err = errText(j.error); }
      render();
    });
    S.view = 'door'; render();
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-lang'); store.set('zsv_lang', lang); render(); });
  });
  chrome();
  start();
})();
</script>
</body>
</html>
